<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sinevest Premium{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:Arial, Helvetica, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7;padding:24px 0;">
        <tr>
            <td align="center">
                <table width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;">
                    <tr>
                        <td style="background-color:#0b1f3a;padding:24px;text-align:center;">
                            <span style="color:#ffffff;font-size:20px;font-weight:bold;">Sinevest Premium</span>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:32px;color:#1a1a1a;font-size:15px;line-height:1.5;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:16px 32px;background-color:#f4f5f7;">
                            <p class="footer" style="font-size:12px;color:#888888;margin:0;">
                                Sinevest Premium All Rights Reserved. <br>
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
